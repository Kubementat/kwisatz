[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kwisatz"
version = "1.2.0"
description = "One command for a kwisatz-managed machine: apply, status, list, info, doctor."
requires-python = ">=3.10"
dependencies = [
    "pyinfra>=3.10,<4",
    "pyyaml",
    "ruamel-yaml>=0.18",
]

[project.scripts]
kwisatz = "kwisatz.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/kwisatz"]

# The read-only payload rides inside the wheel (installed mode: `uvx kwisatz`, `uv tool install`).
# Explicit paths only — never a glob over the repo root — so the user-owned files (machine-config.yml,
# models.yml, gateway.yml), .kwisatz/ and logs/ can never land in a public artifact.
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "kwisatz/payload/tasks"
"lib" = "kwisatz/payload/lib"
"templates" = "kwisatz/payload/templates"
"sync_models" = "kwisatz/payload/sync_models"
"deploy.py" = "kwisatz/payload/deploy.py"
"versions.yml" = "kwisatz/payload/versions.yml"
"renovate.json" = "kwisatz/payload/renovate.json"
"utilities/check-versions.sh" = "kwisatz/payload/utilities/check-versions.sh"
"machine-config.yml.example" = "kwisatz/payload/machine-config.yml.example"
"machine-config-inference.yml.example" = "kwisatz/payload/machine-config-inference.yml.example"
"models.yml.example" = "kwisatz/payload/models.yml.example"
"models.yml.default" = "kwisatz/payload/models.yml.default"
"gateway.yml.example" = "kwisatz/payload/gateway.yml.example"

[tool.hatch.build.targets.sdist]
include = ["src", "deploy.py", "pyproject.toml", "README.md", "docs", "specification", "tests"]

[tool.hatch.build]
exclude = ["/tasks", "/templates", "/lib", "/utilities", "/skills", "/logs", "__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 110
target-version = "py310"
# `kwisatz` (no extension) is the bash entry point, not Python — ruff must not try to parse it
# `/kwisatz` is the bash entry point (no extension), and the leading slash keeps the pattern
# root-relative — bare `kwisatz` would also exclude the package under src/, silently.
exclude = [".venv", "logs", ".kwisatz", "/kwisatz"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "SIM", "B"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM", "B"]
