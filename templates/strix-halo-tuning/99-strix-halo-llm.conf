# Managed by kwisatz tasks/setup-strix-halo-tuning.sh — DO NOT EDIT BY HAND.
# A re-run rewrites this file from the template, so hand edits are lost. Use
# VM_SWAPPINESS in the task instead.
#
# A model this large is not swapped, and the failure mode of swapping it on a
# unified-memory box is not a slow answer but memory compression competing
# with the model for the pages the model is being paged into — an unexplained
# stall, where the alternative (an OOM kill with a clean dmesg line) is at
# least diagnosable.
#
# 10 rather than 0: reclaim should still happen for page cache that is not the
# model, and a machine that never swaps at all can OOM while there are pages
# worth dropping. What matters is that it is the last thing it tries.
#
# Verify:  sysctl vm.swappiness
vm.swappiness=${VM_SWAPPINESS}
