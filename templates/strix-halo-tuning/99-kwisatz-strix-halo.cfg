# Managed by kwisatz tasks/setup-strix-halo-tuning.sh — DO NOT EDIT BY HAND.
# A re-run rewrites this file from the template, so hand edits are lost on the
# next run. Put the reserve in the task instead:
#
#   sudo GPU_RESERVE_GIB=120 ./tasks/setup-strix-halo-tuning.sh
#
# It lands here as ${GTT_SIZE_MIB} MiB of GPU aperture plus
# ${TTM_PAGES_LIMIT} TTM pages — the same ${GPU_RESERVE_GIB} GiB expressed
# twice, because the two knobs are read by two different subsystems and a pair
# that disagrees fails at load time rather than at boot.
#
# Do NOT replace the pair with the widely-copied forum example: an aperture of
# 128 GiB in MiB alongside a pages_limit that is only 120 GiB in pages. That is
# 131072 against 31457280, a mismatch invisible until an allocation crosses the
# smaller number. (The wording here is deliberate: writing the two knobs in
# name=value form inside a comment would make this file look configured to any
# grep that reads it line by line, comment or not — which is exactly how a
# drop-in with no values at all reported "written" for a whole boot.)
#
# Appended to GRUB_CMDLINE_LINUX_DEFAULT rather than replacing it: this file is
# sourced by grub-mkconfig AFTER /etc/default/grub, so the append wins for both
# knobs and nothing the operator set in /etc/default/grub is discarded.
#
# Verify after a reboot, with -E and a +: a pattern written with [0-9]* matches
# an EMPTY value just as happily, and prints a line that looks configured when
# nothing is set:
#   grep -oE 'amdgpu\.gttsize=[0-9]+' /proc/cmdline
#   grep -oE 'ttm\.pages_limit=[0-9]+' /proc/cmdline
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} amdgpu.gttsize=${GTT_SIZE_MIB} ttm.pages_limit=${TTM_PAGES_LIMIT}${AMDGPU_EXTRA_ARGS}"
