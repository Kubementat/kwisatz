# Serves /.well-known/matrix/{client,server} on the server_name apex —
# rendered by tasks/setup-matrix.sh. Content-Type and CORS are set here, so
# they do not depend on Traefik middlewares (Element X ignores the client
# document without CORS).
server {
    listen 80;
    server_name _;

    location /.well-known/matrix/ {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization" always;
    }

    location / {
        return 404;
    }
}
