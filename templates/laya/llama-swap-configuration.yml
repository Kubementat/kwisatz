# Paste this under the 'models:' key of llama-swap's config.yaml, then:
#   sudo systemctl restart llama-swap
"${LAYA_MODEL_ID}":
  name: "Laya (System 1 decision model)"
  cmd: ${VENV_LAYA_SERVE}
  checkEndpoint: /docs
  env:
    - "LAYA_HOST=127.0.0.1"
    - "LAYA_PORT=${PORT}"
    - "LAYA_DEVICE=${LAYA_DEVICE}"
    - "LAYA_PRELOAD=1"
