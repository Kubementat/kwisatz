# Generated by setup-pi-pocket.sh — do not edit here; the script re-renders this
# file on every re-run. Secrets (provider keys) are never substituted in: every
# ${VAR} without a rendered value stays literal and is resolved at container
# start time from the stack's .env via --env-file.
---
name: pi-pocket

services:
  pi-pocket:
    # Built locally from the pinned checkout below — upstream publishes no
    # container image.
    image: ${PI_POCKET_IMAGE}
    build:
      context: ${PI_POCKET_SRC}
      dockerfile: docker/Dockerfile
    container_name: pi-pocket
    restart: unless-stopped
    stop_grace_period: 30s
    # The documented non-root recipe: the image's node user is uid/gid 1000,
    # HOME must be writable, and the bind mounts below are owned by 1000:1000.
    user: "1000:1000"
    environment:
      HOME: /home/node
      # The container-side port stays 8787; PI_POCKET_PORT is the host side.
      PI_POCKET_PORT: 8787
      # Resolved from .env at runtime; 'local' never reaches a published port.
      PI_POCKET_ACCESS: ${PI_POCKET_ACCESS:-lan}
      PI_POCKET_BROWSER: /usr/bin/chromium
      PI_POCKET_BROWSER_ARGS: >-
        ${PI_POCKET_BROWSER_ARGS:---no-sandbox --disable-dev-shm-usage}
      # Optional provider keys, resolved from .env at runtime; empty when unset.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${PI_POCKET_BIND}:${PI_POCKET_PORT}:8787"
    volumes:
      # Nested mounts are upstream's layout on purpose (docs/docker.md):
      # extensions/themes/pi/workspace stay separate host folders.
      - ${PI_POCKET_DATA_DIR}:/data
      - ${PI_POCKET_EXTENSIONS_DIR}:/data/extensions
      - ${PI_POCKET_THEMES_DIR}:/data/themes
      - ${PI_POCKET_PI_DIR}:/home/node/.pi
      - ${PI_POCKET_WORKSPACE_DIR}:/workspace
      # Extra project binds live in docker-compose.override.yml, rendered from
      # PI_POCKET_EXTRA_BINDS; this file stays static.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The container-side port is pinned to 8787 by the environment block
      # above; /style.css answers 200 once the web app is up.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/style.css"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - pi-pocket

networks:
  pi-pocket:
    external: false
