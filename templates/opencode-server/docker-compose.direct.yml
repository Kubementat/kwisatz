# Opencode Server Docker Compose Configuration
# Generated: ${GENERATED_DATE}

networks:
  opencode:
    external: false

services:
  opencode:
    image: ${OPENCODE_IMAGE}
    container_name: opencode
    restart: unless-stopped
    env_file:
      - .env
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    ports:
      - "${OPENCODE_PORT}:4096"
    networks:
      - opencode
    volumes:
      # Opencode keeps its session store and auth under ~/.local/share/opencode
      # and its config under ~/.config/opencode (HOME is /root in this image;
      # check with: docker run --rm <image> debug paths). Mounting anywhere else
      # — the old /data — leaves that state in the container's writable layer,
      # i.e. lost on 'docker compose down'.
      - opencode_data:/root/.local/share/opencode
      - opencode_config:/root/.config/opencode

volumes:
  opencode_data:
  opencode_config:
