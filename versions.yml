# =============================================================================
# versions.yml — every upstream version kwisatz installs, in one place
# =============================================================================
#
# Task scripts read their defaults from here with the kw_* helpers in
# lib/helpers.sh (kw_image / kw_version / kw_pin); every override variable
# (`OPENWEBUI_IMAGE=… ./tasks/setup-openwebui.sh`, `env:` in machine-config.yml,
# `kwisatz apply --env`) still wins over the value below.
#
# Renovate (renovate.json, tasks/setup-renovate.sh) reads this file with one
# jsonata manager and opens bump PRs against `develop`;
# utilities/check-versions.sh prints what is outdated without opening anything.
#
# Entry fields (1:1 Renovate dependency fields):
#   datasource  docker|github-releases|github-tags|pypi|git-refs|custom
#               (custom: not looked up by Renovate)
#   package     image / owner/repo / PyPI name / git URL
#   version     the pinned tag/version — always a quoted string
#   digest      optional; image digest or commit, Renovate keeps it current
#   versioning  optional; Renovate versioning for odd tag schemes
#
# A pin whose next major breaks persisted data carries a `# HELD <reason>`
# comment on the entry AND an allowedVersions rule in renovate.json
# (tests/unit/test_versions.py keeps the two in sync).
# =============================================================================
# image digests and commit SHAs do not fit 80 columns
# yamllint disable rule:line-length
---
agentsview:
  datasource: github-releases
  package: kenn-io/agentsview
  version: "v0.44.0"

hermes:
  # release v0.21.5; the script installs the commit, Renovate compares tags
  datasource: github-tags
  package: NousResearch/hermes-agent
  version: "v2026.9.24"
  digest: "f97608f178d1ffeca59860195ab7da295f7c8e5f"

openwebui:
  datasource: docker
  package: ghcr.io/open-webui/open-webui
  version: "v0.11.1"

renovate:
  datasource: docker
  package: renovate/renovate
  version: "44.193.0"

# ── monitoring (setup-monitoring) ────────────────────────────────────────────
prometheus:
  datasource: docker
  package: prom/prometheus
  version: "v3.13.2"

grafana:
  datasource: docker
  package: grafana/grafana
  version: "13.1.1"

node-exporter:
  datasource: docker
  package: quay.io/prometheus/node-exporter
  version: "v1.12.1"

cadvisor:
  datasource: docker
  package: ghcr.io/google/cadvisor
  version: "v0.60.5"

# ── postiz (setup-postiz) ─────────────────────────────────────────────────────

postiz:
  datasource: docker
  package: ghcr.io/gitroomhq/postiz-app
  version: "v2.24.0"

postiz-postgres:
  # HELD <18: the data volume is tied to the major, upgrade needs pg_upgrade
  datasource: docker
  package: postgres
  version: "17-alpine"

temporal-postgres:
  # HELD <17: the data volume is tied to the major, upgrade needs pg_upgrade
  datasource: docker
  package: postgres
  version: "16"

postiz-redis:
  datasource: docker
  package: redis
  version: "7.2"

elasticsearch:
  # HELD <8: Temporal's visibility store needs Elasticsearch 7
  datasource: docker
  package: elasticsearch
  version: "7.17.27"

temporal:
  datasource: docker
  package: temporalio/auto-setup
  version: "1.28.1"

temporal-ui:
  datasource: docker
  package: temporalio/ui
  version: "2.34.0"

# ── nextcloud (setup-nextcloud) ───────────────────────────────────────────────

nextcloud:
  # HELD <35: Nextcloud upgrades one major at a time — move the major here
  # and in renovate.json deliberately, after a backup
  datasource: docker
  package: nextcloud
  version: "34-apache"

nextcloud-postgres:
  # HELD <18: the data volume is tied to the major, upgrade needs pg_upgrade
  # (the script keeps an existing install on its db/PG_VERSION major)
  datasource: docker
  package: postgres
  version: "17-alpine"

nextcloud-redis:
  datasource: docker
  package: redis
  version: "7-alpine"

# ── matrix (setup-matrix) — grouped in renovate.json ──────────────────────────

synapse:
  datasource: docker
  package: matrixdotorg/synapse
  version: "v1.164.0"

mas:
  datasource: docker
  package: ghcr.io/element-hq/matrix-authentication-service
  version: "1.28.0"

element:
  datasource: docker
  package: vectorim/element-web
  version: "v1.12.33"

matrix-wellknown:
  datasource: docker
  package: nginx
  version: "1.30-alpine"

livekit:
  datasource: docker
  package: livekit/livekit-server
  version: "v1.13.11"

lk-jwt:
  datasource: docker
  package: ghcr.io/element-hq/lk-jwt-service
  version: "0.9.0"

ketesa:
  datasource: docker
  package: ghcr.io/etkecc/ketesa
  version: "v1.5.2"

matrix-postgres:
  # HELD <18: the data volume is tied to the major, upgrade needs pg_upgrade
  # (the script keeps an existing install on its db/PG_VERSION major)
  datasource: docker
  package: postgres
  version: "17-alpine"
