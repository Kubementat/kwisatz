gufo:
  # registry tags carry no "v"; a bump changes serve flags — read the source
  # of the new tag before merging
  datasource: docker
  package: ghcr.io/gufo-org/toolboxes/gufo-runtime
  version: "0.8.1"
  digest: "sha256:56f0a052e784fdfd43ebe2aba590336c8fb5b05c5a813aaebb5ac98d61010afd"

# ── vllm, vllm-omni ───────────────────────────────────────────────────────────

vllm:
  # also the tag of vllm/vllm-openai-rocm (composed in setup-vllm); re-run the
  # F21 registry probe (see the script) before merging a bump
  datasource: docker
  package: vllm/vllm-openai
  version: "v0.27.1"

vllm-omni:
  # was the floating :latest until versions.yml; aarch64 hosts append -aarch64
  datasource: docker
  package: vllm/vllm-omni
  version: "v0.32.0"

vllm-omni-rocm:
  # ROCm builds lag the CUDA image and publish no :latest
  datasource: docker
  package: vllm/vllm-omni-rocm
  version: "v0.30.0"

# ── colqwen (setup-colqwen) ───────────────────────────────────────────────────

ngc-pytorch:
  # must match the host driver (CUDA) and the torch pin of colpali-engine;
  # tested: 25.10-py3 + colpali-engine 0.3.13 on DGX Spark
  datasource: docker
  package: nvcr.io/nvidia/pytorch
  version: "25.10-py3"
  versioning: "regex:^(?<major>\\d+)\\.(?<minor>\\d+)-py(?<compatibility>\\d+)$"

colpali-engine:
  # HELD <0.3.14: 0.3.14+ need transformers 5.x, which drops the LoRA weights
  # of vidore/colqwen2.5-v0.2 (see templates/colqwen/env.template)
  datasource: pypi
  package: colpali-engine
  version: "0.3.13"

# ── tensorfold (setup-tensorfold-spark-qwen38-flash/-27b) ─────────────────────

tensorfold-flash-recipe:
  # recipe repo commit (main @ 2026-10-12); the engine pin lives inside the
  # recipe, and setup-tensorfold-spark-qwen38-flash names its local image after it
  datasource: git-refs
  package: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold
  version: "main"
  digest: "4e1239ddb9d9a4cc3c748e771ae4725335c46a95"

tensorfold-27b-recipe:
  # recipe repo commit (main @ 2026-10-01); moves together with the prebuilt image
  datasource: git-refs
  package: https://github.com/MiaAI-Lab/Qwen3.8-27B-DGX-Spark-TensorFold
  version: "main"
  digest: "c11ff138871cf43d12898d79dbfa4dc952d17ca4"

tensorfold-27b-prebuilt:
  # <TF_VERSION>-<patches hash>; the script derives the local tag from it
  datasource: docker
  package: ghcr.io/miaai-lab/qwen3.8-27b-dgx-spark-tensorfold
  version: "v0.6.0-fb91a0019fdc"
  versioning: "regex:^v(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)-(?<build>[0-9a-f]+)$"

