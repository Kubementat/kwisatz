# =============================================================================
# machine-config.test.yml — VM integration test configuration
# =============================================================================
#
# Used by tests/run-vm-tests.sh on a FRESH Ubuntu VM. Only keep fast, safe,
# non-interactive scripts enabled here. Heavy build/GPU/container-farm
# scripts (llama-cpp, vllm, monitoring, nextcloud, ...) stay disabled;
# include them ad hoc with:  tests/run-vm-tests.sh --scripts setup-xxx
#
# IMPORTANT (lockout avoidance):
#   The test harness reaches the VM on port 22. The scripts below use
#   SSHD_PORT=22 so that setup-sshd/configure-firewall/setup-fail2ban
#   never move or firewall the harness connection (their default 2224
#   would cut the harness off mid-run).
#
#   The VM has no operator key and the harness must not arm a UFW
#   self-rollback timer, so additionally:
#   - setup-sshd:    SSHD_ALLOW_PASSWORDAUTH=yes  (keep password auth on
#                    if the injected key is ever missing)
#   - configure-firewall: FIREWALL_ARM_ROLLBACK=false (headless CI opt-out)
#   The scripts' own lockout guards (pre-flight, sshd -t, key check) are
#   still fully active and are covered by the acceptance tests.
#
# Order matters: setup-basics first (git/yq/jq/node), setup-docker before
# setup-traefik.
# =============================================================================
---
version: 1

scripts:
  setup-basics:
    enabled: true
    description: Core utilities (apt packages, uv, nvm/node, hf, herdr, hunk)
    env: {}
    args: []

  setup-agent-sandbox:
    enabled: true
    description: bwrap sandbox prerequisites + asb wrapper
    env: {}
    args: []

  configure-firewall:
    enabled: true
    description: UFW rules (SSH kept on port 22 for harness access)
    env:
      SSHD_PORT: "22"
      FIREWALL_ARM_ROLLBACK: "false"
    args: []

  setup-docker:
    enabled: true
    description: Docker Engine
    env: {}
    args: []

  setup-sshd:
    enabled: true
    description: sshd hardening (kept on port 22 for harness access)
    env:
      SSHD_PORT: "22"
      SSHD_ALLOW_PASSWORDAUTH: "yes"
    args: []

  setup-fail2ban:
    enabled: true
    description: fail2ban SSH protection
    env:
      SSHD_PORT: "22"
    args: []

  setup-neovim:
    enabled: true
    description: Neovim + plugins
    env: {}
    args: []

  setup-pi:
    enabled: true
    description: Pi coding agent + extensions
    env: {}
    args: []

  setup-ai-agent-skills:
    enabled: true
    description: AI agent skills stack (ai_agent_skills clone, skills, agent profiles, herdr-cli helpers)
    env: {}
    args: []

  setup-traefik:
    enabled: true
    description: Traefik reverse proxy (docker)
    env:
      # setup-traefik rejects the default ACME_EMAIL (Let's Encrypt requires a
      # real address). The VM never issues certificates — this only proves the
      # stack, the unprivileged socket proxy, and Docker provider discovery.
      ACME_EMAIL: "vmtest@example.com"
    args: []

  # Ad-hoc service tiers for --scripts runs (see ticket improvements-2/08):
  #   tests/run-vm-tests.sh --scripts \
  #     setup-docker,setup-traefik,setup-planka,setup-monitoring
  # Both stay out of the default set (heavy images).
  setup-planka:
    enabled: false
    description: Planka Kanban (docker) — ad-hoc via --scripts
    env: {}
    args: []

  setup-postiz:
    enabled: false
    description: Postiz scheduler (docker + Temporal) — ad-hoc via --scripts
    env: {}
    args: []

  setup-monitoring:
    enabled: false
    description: Prometheus + Grafana (docker) — ad-hoc via --scripts
    env:
      # Required by the script (no opt-out).
      GRAFANA_DOMAIN: "monitoring.vmtest"
      # Re-runs converge the existing stack (ticket 12), so the idempotency
      # phase exercises the full render + start + health-gate path without
      # forcing a re-create. Set MONITORING_FORCE=true to test re-create.
    args: []

  setup-nextcloud:
    enabled: false
    description: Nextcloud + Postgres + Redis (docker) — ad-hoc via --scripts
    env:
      # LAN mode: the NAT VM has no DNS for the ACME resolver, so the
      # --scripts run exercises the direct/ufw path, not Traefik
      # routing.
      NEXTCLOUD_TRAEFIK: "false"
    args: []

  # Zero-config self-backup: storage host (local-disk mode on the VM's root
  # fs) + a local-mode client + an initial full backup. Fast and idempotent.
  setup-backup-server:
    enabled: false
    description: Borg backup host + self-backup — ad-hoc via --scripts
    env: {}
    args: []

  # Matrix homeserver with calls — ad-hoc, needs docker + traefik first:
  #   tests/run-vm-tests.sh --scripts setup-docker,setup-traefik,setup-matrix
  # The VM gets no ACME certificate (Traefik runs sniStrict), so the script's
  # through-Traefik checks only warn; the stack, MAS, DB bootstrap, admin
  # creation and the re-run convergence are what this case proves.
  setup-matrix:
    enabled: false
    description: Matrix (Synapse + MAS + Element + LiveKit) — ad-hoc via --scripts
    env:
      MATRIX_SERVER_NAME: "matrix.test"
      MATRIX_RTC: "true"
    args: []

  # Standalone client in local mode (no server host) with a small scope.
  setup-backup-client:
    enabled: false
    description: Borg backup client (local repo) — ad-hoc via --scripts
    env: {}
    args: ["--paths", "/etc"]

  # Kept out of the default fast suite: creates a nested KVM guest inside the
  # test VM (needs nested virtualization on the host and a bigger test VM):
  #   tests/run-vm-tests.sh --ram 10 --vcpu 4 --disk 60 --timeout 60 \
  #     --scripts setup-basics,configure-firewall,setup-docker,setup-hermes
  # Exercises the prerequisite bootstrap, the egress allowlist (host:22 = the
  # test VM's own sshd) and 'hermes serve' behind the host proxy, with ufw
  # active and Docker installed on the test VM.
  setup-hermes:
    enabled: false
    description: Hermes Agent in a nested VM — ad-hoc via --scripts
    env:
      # virt-runner's 'create --mount' is not on the repository's default
      # branch yet; drop this once it is released there.
      VIRT_RUNNER_BRANCH: "develop"
      HERMES_VM_DISK: "20"
      HERMES_ALLOWED_ENDPOINTS: "host:22"
      HERMES_SERVE: "true"
      HERMES_SERVE_ALLOW_FROM: "192.168.122.0/24"
    args: []

  # Kept out of the default fast suite (heavy CUDA image pull). VMs are
  # GPU-less: the explicit --cpu arg exercises the CPU guard paths
  # deliberately (D9); auto-detect would pick cpu anyway. NOTE (D9): the CPU
  # backend renders the CUDA vllm/vllm-openai image with --device cpu —
  # best-effort, see --help and .tickets/vllm-cpu-image.md.
  setup-vllm:
    enabled: false
    description: vLLM inference engine (docker) — ad-hoc via --scripts
    env:
      VLLM_PORT: "8000"
    args: ["--cpu"]

  # Kept out of the default fast suite (source build + ~1.3 GB model download).
  # CPU backend for the GPU-less default VM; a GPU VM is needed for the vulkan
  # build + /dev/dri group access. Ad hoc via --scripts (see tests/README.md).
  setup-omnivoice:
    enabled: false
    description: OmniVoice.cpp TTS server (systemd) — ad-hoc via --scripts
    env:
      OMNIVOICE_BACKEND: cpu
      OMNIVOICE_PORT: "8977"
    args: []
