<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">kwisatz — Private AI on your own hardware</title>
  <desc id="d">Fresh Ubuntu box to a local LLM inference server. Two YAML files, one command. Your models, your data, your hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- right-hand emblem: a private enclave of nodes around a shielded core -->
    <g transform="translate(1010 200)">
      <circle r="190" fill="url(#glow)"/>
      <circle r="150" fill="none" stroke="#f59e0b" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 9"/>
      <circle r="105" fill="none" stroke="#f59e0b" stroke-opacity="0.30" stroke-width="1.5"/>

      <g stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5">
        <line x1="0" y1="0" x2="0" y2="-105"/>
        <line x1="0" y1="0" x2="91" y2="-52"/>
        <line x1="0" y1="0" x2="91" y2="52"/>
        <line x1="0" y1="0" x2="0" y2="105"/>
        <line x1="0" y1="0" x2="-91" y2="52"/>
        <line x1="0" y1="0" x2="-91" y2="-52"/>
      </g>

      <g fill="#0f172a" stroke="#fbbf24" stroke-width="2">
        <circle cx="0" cy="-105" r="9"/>
        <circle cx="91" cy="-52" r="9"/>
        <circle cx="91" cy="52" r="9"/>
        <circle cx="0" cy="105" r="9"/>
        <circle cx="-91" cy="52" r="9"/>
        <circle cx="-91" cy="-52" r="9"/>
      </g>
      <g fill="#fde68a" fill-opacity="0.55">
        <circle cx="106" cy="-106" r="3"/>
        <circle cx="-140" cy="40" r="3"/>
        <circle cx="40" cy="142" r="3"/>
        <circle cx="-60" cy="-138" r="2.5"/>
        <circle cx="146" cy="30" r="2.5"/>
      </g>

      <!-- shield with a lock: private by default -->
      <path d="M0 -52 L42 -36 V2 C42 30 22 48 0 58 C-22 48 -42 30 -42 2 V-36 Z"
            fill="#0f172a" stroke="url(#shield)" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-15" y="-4" width="30" height="24" rx="4" fill="url(#shield)"/>
      <path d="M-9 -4 V-13 A9 9 0 0 1 9 -13 V-4" fill="none" stroke="url(#shield)" stroke-width="4"/>
      <circle cx="0" cy="7" r="3.5" fill="#0f172a"/>
    </g>

    <!-- left: wordmark and pitch -->
    <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="72" y="82" font-size="16" font-weight="600" letter-spacing="4" fill="#fbbf24" fill-opacity="0.9">PRIVATE AI · SELF-HOSTED · YOUR HARDWARE</text>
      <text x="68" y="178" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)">kwisatz</text>
      <text x="72" y="226" font-size="27" font-weight="500" fill="#e2e8f0">Fresh Ubuntu box → private LLM inference server.</text>
      <text x="72" y="260" font-size="20" fill="#94a3b8">Two YAML files. One command. No tokens leave your network.</text>
    </g>

    <!-- terminal pill -->
    <g transform="translate(72 296)">
      <rect width="478" height="50" rx="10" fill="#020617" fill-opacity="0.75" stroke="#334155"/>
      <circle cx="22" cy="25" r="5" fill="#ef4444" fill-opacity="0.85"/>
      <circle cx="40" cy="25" r="5" fill="#f59e0b" fill-opacity="0.85"/>
      <circle cx="58" cy="25" r="5" fill="#22c55e" fill-opacity="0.85"/>
      <text x="82" y="32" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="19">
        <tspan fill="#64748b">$</tspan><tspan fill="#e2e8f0"> ./kwisatz apply</tspan><tspan fill="#22c55e">  ✓ serving :9292</tspan>
      </text>
    </g>

    <!-- stack chips -->
    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">
      <g transform="translate(570 296)">
        <rect width="118" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
        <text x="59" y="15.5" text-anchor="middle">llama.cpp</text>
      </g>
      <g transform="translate(696 296)">
        <rect width="104" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
        <text x="52" y="15.5" text-anchor="middle">vLLM</text>
      </g>
      <g transform="translate(570 326)">
        <rect width="118" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
        <text x="59" y="15.5" text-anchor="middle">Open WebUI</text>
      </g>
      <g transform="translate(696 326)">
        <rect width="104" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
        <text x="52" y="15.5" text-anchor="middle">traefik</text>
      </g>
    </g>
  </g>
</svg>
